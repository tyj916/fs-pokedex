name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install 
      - name: Check style 
        run: npm run eslint
      - name: Run npm test
        run: npm test
      - name: Run npm run build
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps 
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Trigger deployment 
        if: ${{ github.event_name == 'push' 
          && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' 
          && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch 
  notify_build_status_discord:
    needs: [simple_deployment_pipeline, tag_release]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      github.event_name == 'push' &&
      !contains(join(github.event.commits.*.message, ' '), '#skip')
    steps:
      - name: Notify deployment success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.FS_DISCORD_WEBHOOK }}
          nodetail: true
          content: ":white_check_mark: **Deployment Successful!** A new version deployed to production"
          title: "Deployment Details"
          url: "https://github.com/tyj916/fs-pokedex"
          description: |
            **Commit:** `${{ github.sha }}`
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.username }}
      - name: Notify build failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.FS_DISCORD_WEBHOOK }}
          nodetail: true
          content: ":x: **Build Failed!** The pipeline encountered an error"
          title: "Failure Details"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.username }}
            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
